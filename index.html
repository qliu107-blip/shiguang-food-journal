const BodyModel=(()=>{

   y=y.map((v,i)=>v+dt*(k1[i]+2*k2[i]+2*k3[i]+k4[i])/6);energyOut+=dt*(k1[5]+2*k2[5]+2*k3[5]+k4[5])/6;t+=dt;
   if(!y.every(Number.isFinite)||y[0]<=0||y[1]<=0||y[2]<0||weight()<=0)return result(false,'超出模型可计算范围');

function dateKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
const today=()=>dateKey(), shift=(key,n)=>{let d=new Date(key+'T12:00:00');d.setDate(d.getDate()+n);return dateKey(d)};
const seeds=CATALOG;

function migrateCatalog(){

 for(let f of state.foods)if(aliases[f.name])f.name=aliases[f.name];

 for(let seed of seeds){let f=state.foods.find(f=>f.seed===seed.key||f.type==='ingredient'&&f.name===seed.name);if(f){if(!f.photo||!f.photo.startsWith('data:')){f.photo='builtin:'+seed.key;f.photoCredit=seed.photoCredit}f.seed=seed.key;if(['sugar','soy'].includes(seed.key)&&!f.userEdited){if(seed.key==='sugar'&&[387,400].includes(f.kcal))f.kcal=387;f.note=seed.note;f.source=seed.source;}f.note??=seed.note;f.unitGrams??=seed.unitGrams;f.unitName??=seed.unitName;f.source??=seed.source;}else state.foods.push({...seed,photo:'builtin:'+seed.key,id:uid(),type:'ingredient',last:0,seed:seed.key});}

 try{localStorage.setItem('shiguang-v1',JSON.stringify(state))}catch{}
}

let pickerContext=null,pickerQuery='',collapsed={},forecastCache={},planCache={};

const meals=['午饭','晚饭','额外','早餐'], mealIcon=m=>({'午饭':'☀️','晚饭':'🌙','额外':'☕','早餐':'🌤️','未分类':'🍽️'}[m]||'🍽️'), logs=d=>state.logs.filter(l=>l.date===d),total=d=>logs(d).reduce((s,l)=>s+Number(l.kcal),0),round=n=>Math.round(n*10)/10;

function modalClose(){ $('#overlay').innerHTML='';draft=null;recipe=null;pickerContext=null;heldRecipe=null;heldLog=null;returnToLog=false }

function render(){document.body.dataset.page=page;$('#nav').innerHTML=[['home','◒','今日'],['log','＋','记饮食'],['library','▤','食物库'],['me','♧','我的']].map(([id,i,n])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><b>${i}</b>${n}</button>`).join('');$('#main').innerHTML=({home,log:logPage,library,me:myPage}[page])()}

function chart(){let dates=Array.from({length:7},(_,i)=>shift(selected,i-6)).filter(d=>logs(d).length||state.complete[d]);if(!dates.length)return '<div class="trend-empty">暂无记录</div>';let max=Math.max(1,...dates.map(total))*1.15,segments=[],current=[];dates.forEach((d,i)=>{if(i&&shift(dates[i-1],1)!==d){segments.push(current);current=[]}current.push(`${(i+.5)/dates.length*100},${100-total(d)/max*85}`)});segments.push(current);return `<div class="chart">${dates.map(d=>`<div class="barcol"><span>${Math.round(total(d))}</span><div class="bar ${d===selected?'today':''}" style="height:${total(d)/max*85}%"></div><span>${d===today()?'今天':d.slice(5).replace('-','/')}</span></div>`).join('')}<svg viewBox="0 0 100 100" preserveAspectRatio="none">${segments.filter(ps=>ps.length>1).map(ps=>`<polyline points="${ps.join(' ')}" fill="none" stroke="#b6a375" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join('')}</svg></div>`}

function forecast(){let p=state.profile;if(!validBody(p)||!(p.target>0))return {text:'补充身体信息',missing:true};let ds=Object.keys(state.complete).filter(d=>state.complete[d]&&d<today()).sort().slice(-14);if(ds.length<3)return {text:'记录后估算',insufficient:true};let avg=ds.reduce((a,d)=>a+total(d),0)/ds.length,key=JSON.stringify([p,ds,avg,today()]);if(forecastCache.key===key)return forecastCache.value;let r=BodyModel.simulate(p,avg,3650,{target:p.target}),answer;if(r.valid&&r.reached){let low=BodyModel.simulate(p,avg,3650,{target:p.target,burnScale:.9}),high=BodyModel.simulate(p,avg,3650,{target:p.target,burnScale:1.1});answer={text:r.day<.01?'已达目标':`约 ${Math.ceil(r.day)} 天`,days:Math.ceil(r.day),avg,recorded:ds.length,scenario:[low,high].map(x=>x.valid&&x.reached?Math.ceil(x.day):null)}}else answer={text:r.error?'超出模型范围':'当前摄入下未预测到达',avg,recorded:ds.length,detail:r.error};forecastCache={key,value:answer};return answer;}

function library(){return `<div class="library-tabs"><button class="${libraryType==='dish'?'active':''}" onclick="libraryType='dish';search='';render()">菜品</button><button class="${libraryType==='ingredient'?'active':''}" onclick="libraryType='ingredient';search='';render()">食材</button></div><input class="search" placeholder="搜索" aria-label="搜索食物" value="${esc(search)}" oninput="search=this.value;$('#foodresults').innerHTML=foodResults()"><div id="foodresults">${foodResults()}</div>`}

function foodResults(){let fs=state.foods.filter(f=>(libraryType==='ingredient'?f.type==='ingredient':f.type!=='ingredient')&&f.name.includes(search)).sort((a,b)=>(b.last||0)-(a.last||0));return `<div class="foodgrid three"><button class="foodtile new-tile" onclick="foodForm()"><div class="new-photo">＋</div><small>新建${libraryType==='ingredient'?'食材':'菜品'}</small></button>${groupFoods(fs).map(f=>foodTile(f,`openVersions('${f.id}','library')`)).join('')}</div>`}

function photoInput(photo=''){return `<label class="photo" for="photo">${photo?`<img src="${esc(photoSrc(photo))}" alt="食物照片">`:'<span>＋ 添加照片</span>'}</label><input id="photo" class="hide" type="file" accept="image/*" onchange="readPhoto(this)">`}

function logForm(id=null,meal=''){let l=state.logs.find(x=>x.id===id);draft=l?{...l}:{id:uid(),date:today(),meal,name:'',grams:'',kcal:'',foodId:'',manual:false};recipe=null;if(l)renderLogEditor();else openPicker('log');}
function stashLog(){if(!draft||!$('#logform'))return;Object.assign(draft,{name:$('#logname').value,grams:logGrams(),amount:Number($('#grams').value),amountUnit:$('#logunit')?.value||'g',kcal:$('#kcal').value,date:$('#logdate').value,meal:$('#meal').value});}
function renderLogEditor(){let d=draft;modal('',`<form id="logform" onsubmit="event.preventDefault();saveLog()"><button type="button" class="chosen-food" onclick="stashLog();openPicker('log')">${d.photo?icon(d):''}<h2>${esc(d.name||'今天吃了什么')}</h2><span>更换 ›</span></button><label for="logname">名称</label><input id="logname" value="${esc(d.name)}" placeholder="可留空"><div class="fields"><div><label for="grams">数量 ${servingSelect(d)}</label><input id="grams" type="number" min="0" step="any" value="${d.amountUnit==='serving'?d.amount:(d.grams??'')}" oninput="recalcLog()"></div><div><label for="kcal">大卡</label><input id="kcal" required type="number" min="0" step="any" value="${d.kcal??''}" oninput="draft.manual=true"></div></div><div class="fields"><div><label for="logdate">日期</label><input id="logdate" required type="date" max="${today()}" value="${d.date}"></div><div><label for="meal">餐别</label><select id="meal"><option value="">未分类</option>${meals.map(m=>`<option ${m===d.meal?'selected':''}>${m}</option>`).join('')}</select></div></div><label class="keep"><input id="keepfood" type="checkbox"> 存为菜品</label><div class="actions">${state.logs.some(l=>l.id===d.id)?`<button type="button" class="secondary" onclick="deleteLog('${d.id}')">删除</button>`:''}<button class="primary">完成</button></div></form>`)}
function openPicker(context){pickerContext=context;pickerQuery='';modal(context==='ingredient'?'选食材':'选菜',`<div class="picker"><input class="search" aria-label="搜索" placeholder="搜索" oninput="pickerQuery=this.value;$('#picker-results').innerHTML=pickerResults()"><div id="picker-results">${pickerResults()}</div>${context==='log'?'<button class="quick-log secondary" onclick="pickerContext=null;renderLogEditor()">直接填大卡</button>':''}</div>`)}
function foodTile(f,action){return `<button class="foodtile" onclick="${action}">${icon(f)}<strong>${esc(f.name)}</strong><small>${round(f.kcal)} 大卡 / 100g</small>${f.servings?`<small>1份 · ${round((f.yield||f.packgrams)/f.servings)}g · ${round(f.kcal*(f.yield||f.packgrams)/f.servings/100)} 大卡</small>`:''}${versionCount(f)>1?`<small>${versionCount(f)} 次做法 ›</small>`:''}${f.unitGrams?`<small>约 1${esc(f.unitName||'个')} · ${f.unitGrams}g / ${round(f.kcal*f.unitGrams/100)} 大卡</small>`:''}</button>`}
function pickerResults(){let fs=state.foods.filter(f=>(pickerContext==='ingredient'?f.type==='ingredient':f.type!=='ingredient')&&f.name.includes(pickerQuery)).sort((a,b)=>(b.last||0)-(a.last||0));return `<div class="foodgrid three"><button class="foodtile new-tile" onclick="newFromPicker()"><div class="new-photo">＋</div><small>新建${pickerContext==='ingredient'?'食材':'菜品'}</small></button>${groupFoods(fs).map(f=>foodTile(f,`openVersions('${f.id}','${pickerContext}')`)).join('')}</div>`}
function chooseFood(id){let f=state.foods.find(f=>f.id===id);if(!f)return;if(pickerContext==='ingredient'){recipe.parts.push({foodId:id,grams:100});pickerContext=null;foodEditor();return}Object.assign(draft,{foodId:id,name:f.name,photo:f.photo,grams:f.servings?(f.yield||f.packgrams)/f.servings:100,amount:f.servings?1:100,amountUnit:f.servings?'serving':'g',kcal:round(f.servings?f.kcal*(f.yield||f.packgrams)/f.servings/100:f.kcal),manual:false});pickerContext=null;renderLogEditor();}
function pickFood(id){chooseFood(id)}
function recalcLog(){let f=state.foods.find(f=>f.id===draft.foodId);if(f){$('#kcal').value=round(logGrams()*f.kcal/100);draft.manual=false}}

function saveLog(){let l={...draft,name:$('#logname').value.trim(),grams:$('#grams').value?logGrams():null,amount:Number($('#grams').value),amountUnit:$('#logunit')?.value||'g',kcal:Number($('#kcal').value),date:$('#logdate').value,meal:$('#meal').value};if(!Number.isFinite(l.kcal)||l.kcal<0||!l.date||l.date>today())return toast('请填写有效的日期和大卡');if($('#keepfood').checked){if(!l.name||!(l.grams>0))return toast('存为食物需要填写名称和大于零的克数');let f={id:uid(),name:l.name,emoji:l.emoji,photo:l.photo,type:'product',kcal:l.kcal/l.grams*100,last:Date.now()};state.foods.push(f);l.foodId=f.id}let i=state.logs.findIndex(x=>x.id===l.id);i<0?state.logs.push(l):state.logs.splice(i,1,l);let f=state.foods.find(f=>f.id===l.foodId);if(f)f.last=Date.now();state.complete[l.date]=false;if(!save())return;selected=l.date;modalClose();render();toast('已保存这份食光')}
function deleteLog(id){if(!confirm('删除这条饮食记录？'))return;let l=state.logs.find(x=>x.id===id);state.complete[l.date]=false;state.logs=state.logs.filter(x=>x.id!==id);save();modalClose();render()}
let returnToLog=false,heldLog=null,heldRecipe=null,heldReturn=false;
function foodForm(id=null,fromLog=false,forcedType=null){returnToLog=fromLog;if(fromLog&&draft){stashLog();heldLog={...draft}}let f=state.foods.find(x=>x.id===id);recipe=f?JSON.parse(JSON.stringify(f)):{id:uid(),name:'',type:forcedType||(libraryType==='ingredient'?'ingredient':'recipe'),kcal:'',parts:[],yield:''};recipe.parts||=[];recipe.saveMode=f&&f.type==='recipe'?'new':'update';foodEditor()}
function newFromPicker(){let ctx=pickerContext;pickerContext=null;if(ctx==='ingredient'){heldRecipe=recipe;heldReturn=returnToLog;foodForm(null,false,'ingredient')}else{heldLog={...draft};foodForm(null,true,'recipe')}}
function foodEditor(){let r=recipe;modal(r.type==='ingredient'?'食材':r.name?'编辑菜品':'新建菜品',`<form onsubmit="event.preventDefault();saveFood()">${photoInput(r.photo)}<label for="fname">名称</label><input required id="fname" value="${esc(r.name)}">${r.type!=='ingredient'?`<div class="tabs"><button type="button" class="${r.type==='recipe'?'active':''}" onclick="stashFood();recipe.type='recipe';foodEditor()">自己做菜</button><button type="button" class="${r.type==='product'?'active':''}" onclick="stashFood();recipe.type='product';foodEditor()">购买成品</button></div>`:''}${r.type==='recipe'?`<div class="tabs"><button type="button" class="${!r.direct?'active':''}" onclick="stashFood();recipe.direct=false;foodEditor()">食材 + 额外热量</button><button type="button" class="${r.direct?'active':''}" onclick="stashFood();recipe.direct=true;foodEditor()">直接填总热量</button></div>${r.direct?`<label for="directkcal">整道菜总大卡</label><input id="directkcal" required type="number" min="0" step="any" value="${r.directKcal??''}" oninput="foodCalc()">`:`<div id="parts">${partRows()}</div><button type="button" class="secondary" onclick="stashFood();openPicker('ingredient')">＋ 食材</button><label for="extrakcal">额外大卡</label><input id="extrakcal" type="number" min="0" step="any" value="${r.extraKcal||''}" placeholder="可留空" oninput="foodCalc()">`}<label for="yield">出锅后总重量 · g</label><input id="yield" type="number" min="0.1" step="any" required value="${r.yield||''}" oninput="foodCalc()">`:`<div class="fields"><div><label for="packgrams">重量 · g</label><input id="packgrams" type="number" min="0.1" step="any" required value="${r.packgrams||100}" oninput="foodCalc()"></div><div><label for="packkcal">对应大卡</label><input id="packkcal" type="number" min="0" step="any" required value="${r.packkcal??r.kcal}" oninput="foodCalc()"></div></div>`}${r.type!=='ingredient'?`<label for="servings">共几份</label><input id="servings" type="number" min="0.01" step="any" value="${r.servings||''}" placeholder="可留空，如 4 份" oninput="foodCalc()">`:''}<div id="foodcalc" class="food-calc"></div>${r.type==='ingredient'?`<details><summary>单个份量 / 食材说明</summary><div class="fields"><div><label for="unitgrams">约一个的可食重量 · g</label><input id="unitgrams" type="number" min="0" step="any" value="${r.unitGrams||''}"></div><div><label for="unitname">单位</label><input id="unitname" value="${esc(r.unitName||'个')}"></div></div><label for="density">液体密度 · g/mL（留空为固体）</label><input id="density" type="number" min="0.01" step="any" value="${liquidDensity(r)||''}"><p class="note">一勺 7 mL；按密度换算克数。<a target="_blank" href="https://www.fao.org/4/ap815e/ap815e.pdf">密度参考</a></p><label for="foodnote">说明</label><input id="foodnote" value="${esc(r.note||'生重，可食部分；每个大小不同，以称重为准')}"><p class="note">${esc(r.source||'用户录入，请以包装营养表为准')}</p></details>`:''}<div class="actions">${state.foods.some(f=>f.id===r.id)?`<button type="button" class="secondary" onclick="deleteFood()">删除</button>`:''}<button class="primary">${r.saveMode==='new'?'另存这次做法':'保存'}</button></div>${state.foods.some(f=>f.id===r.id)&&r.type==='recipe'?`<label class="keep"><input type="checkbox" ${r.saveMode==='update'?'checked':''} onchange="stashFood();recipe.saveMode=this.checked?'update':'new';foodEditor()"> 覆盖当前做法（默认另存）</label>`:''}</form>`);foodCalc()}

function partRows(){return (recipe.parts||[]).map((p,i)=>{let f=state.foods.find(f=>f.id===p.foodId),density=liquidDensity(f);return `<div class="part-wrap"><div class="ingredient">${icon(f||{})}<span class="grow">${esc(f?.name||'已删除食材')}</span><input aria-label="${esc(f?.name||'食材')}数量" type="number" min="0" step="any" value="${p.unit==='spoon'?p.amount:p.grams||''}" oninput="updatePart(${i},this.value)">${density?`<select class="part-unit" aria-label="计量单位" onchange="stashFood();setPartUnit(${i},this.value)"><option value="g">克</option><option value="spoon" ${p.unit==='spoon'?'selected':''}>勺</option></select>`:'<small>g</small>'}<button type="button" aria-label="删除食材" onclick="stashFood();recipe.parts.splice(${i},1);foodEditor()">×</button></div>${density?`<div class="spoon-shortcuts"><button type="button" onclick="setSpoon(${i},0.5)">半勺</button><button type="button" onclick="setSpoon(${i},1)">一勺</button><small>1勺 = 7mL ≈ ${round(7*density)}g</small></div>`:''}</div>`}).join('')}

function stashFood(){if(!recipe||!$('#fname'))return;recipe.name=$('#fname').value;for(let [id,key] of [['servings','servings'],['directkcal','directKcal'],['extrakcal','extraKcal'],['density','density']])if($('#'+id))recipe[key]=$('#'+id).value===''?null:Number($('#'+id).value);if($('#yield'))recipe.yield=Number($('#yield').value);if($('#packgrams')){recipe.packgrams=Number($('#packgrams').value);recipe.packkcal=Number($('#packkcal').value);recipe.kcal=recipe.packkcal/recipe.packgrams*100}if($('#unitgrams')){recipe.unitGrams=Number($('#unitgrams').value)||null;recipe.unitName=$('#unitname').value;recipe.note=$('#foodnote').value}}

function foodCalc(){if(!recipe)return;let sum;if(recipe.type==='recipe'){let ingredientSum=(recipe.parts||[]).reduce((s,p)=>s+(state.foods.find(f=>f.id===p.foodId)?.kcal||0)*Number(p.grams)/100,0);sum=recipe.direct?Number($('#directkcal')?.value??recipe.directKcal):ingredientSum+Number($('#extrakcal')?.value??recipe.extraKcal??0)}else sum=Number($('#packkcal')?.value);let weight=Number($(recipe.type==='recipe'?'#yield':'#packgrams')?.value),k=sum/weight*100,servings=Number($('#servings')?.value);recipe.computed=k;recipe.totalKcal=sum;$('#foodcalc').innerHTML=`<small>合计 ${round(sum)} 大卡</small><p style="margin-top:10px">${Number.isFinite(k)?`${round(k)} 大卡 / 100克 · ${Math.round(k*10)/1000} 大卡 / 克`:'填写总重量后计算'}</p>${servings>0?`<p style="margin-top:8px">每份 ${round(weight/servings)}g · ${round(sum/servings)} 大卡</p>`:''}`}

function saveFood(){stashFood();foodCalc();if(!recipe.name.trim()||!Number.isFinite(recipe.computed)||recipe.computed<0)return toast('请检查名称、重量与热量');if(recipe.type==='recipe'&&(!(recipe.yield>0)||(!recipe.direct&&!recipe.parts.some(p=>p.grams>0)&&!(recipe.extraKcal>0))))return toast('请填写食材或热量，以及出锅重量');if(recipe.servings!=null&&!(recipe.servings>0))return toast('份数需大于零');if(recipe.type==='recipe'&&recipe.saveMode==='new'){recipe.groupId=recipe.groupId||recipe.id;recipe.parentId=recipe.id;recipe.id=uid();recipe.createdAt=Date.now()}recipe.createdAt||=Date.now();let f={...recipe,kcal:recipe.computed,userEdited:true},i=state.foods.findIndex(x=>x.id===f.id);i<0?state.foods.push(f):state.foods.splice(i,1,f);if(!save())return;if(heldRecipe){recipe=heldRecipe;heldRecipe=null;returnToLog=heldReturn;recipe.parts.push({foodId:f.id,grams:100});foodEditor();return}if(returnToLog){draft={...heldLog,foodId:f.id,name:f.name,photo:f.photo,grams:f.servings?(f.yield||f.packgrams)/f.servings:100,amount:f.servings?1:100,amountUnit:f.servings?'serving':'g',kcal:round(f.servings?f.kcal*(f.yield||f.packgrams)/f.servings/100:f.kcal),manual:false};recipe=null;returnToLog=false;heldLog=null;renderLogEditor()}else{modalClose();render()}toast('已保存')}

function deleteFood(){if(state.foods.some(f=>(f.parts||[]).some(p=>p.foodId===recipe.id)))return toast('该食材正被菜品引用，请先编辑相关菜品');if(!confirm('删除这个食物？历史饮食记录仍会保留。'))return;state.foods=state.foods.filter(f=>f.id!==recipe.id);save();modalClose();render()}
function myPage(){let p=state.profile;return '<h1 class="settings-title">我的</h1>'+`<section class="card"><div class="row"><div><h2>个人信息与目标</h2><p class="sub">${validBody(p)?`${p.height} cm · ${p.weight} kg${p.target?' → '+p.target+' kg':''}`:'身高、体重与每日目标'}</p></div><button class="secondary" onclick="profileForm()">编辑</button></div><div class="stats"><div><strong>${dailyBudget()||'未设置'}</strong><small>每日目标 · 大卡${p?.budgetMode==='auto'?'（估算）':''}</small></div>${validBody(p)?`<div><strong>${Math.round(dailyBurn(p)/p.activity)}</strong><small>静息代谢估算 · 大卡</small></div>`:''}</div></section><section class="card"><h3>饮食速报</h3><p class="sub">所有已记录日期都在这里，持续保留</p>${[...new Set(state.logs.map(l=>l.date))].sort().reverse().map(d=>`<button class="row" style="width:100%;padding:15px 0;border-bottom:1px solid var(--line)" onclick="report('${d}')"><span>${d}</span><span>${Math.round(total(d))} 大卡　›</span></button>`).join('')||'<p class="empty">记下第一餐后，这里就会有你的速报。</p>'}</section><section class="card"><h3>数据与备份</h3><p class="note" style="margin:12px 0">当前版本保存在此设备的浏览器中，不自动清空。清理浏览器数据或更换手机前，请导出备份；支持把照片和全部记录一起恢复。</p><div class="row"><button class="secondary" onclick="exportData()">↓ 导出备份</button><button class="secondary" onclick="$('#importfile').click()">↑ 恢复备份</button></div><input class="hide" id="importfile" type="file" accept="application/json" onchange="importData(this)"></section><section class="card source"><h3>计算方式</h3><p class="note" style="margin-top:12px">静息代谢（Mifflin–St Jeor）：10 × 体重(kg) + 6.25 × 身高(cm) − 5 × 年龄 + 常数；男 +5，女 −161。<br>每日总消耗估算 = 静息代谢 × 活动系数。活动量影响总消耗，不直接改变静息代谢公式。<br>体重预测采用 Hall 等（2011）方程的本地数值实现：脂肪、瘦体重、糖原、水分分别更新；消耗包含身体成分、随体重变化的活动成本、食物热效应与14天时间尺度的代谢适应。以四阶Runge–Kutta每0.25天积分，按目标期限反求摄入；按近期完整记录的平均摄入正向求到达时间。不再使用固定“体重差×7700”。<br>未知体脂率按论文回归式估计（不是实测），维持摄入默认静息代谢×活动系数，假设初始能量平衡；碳水默认前后各占50%，钠摄入不变。这些可在模型参数里修改。没有蛋白质或训练数据，不能精确预测肌肉变化。本实现并非NIH官方工具，也未经临床验证；模型值不是饮食处方或到达日期保证。</p><p class="note"><a href="https://www.unm.edu/~lkravitz/Article%20folder/Metabolism.pdf" target="_blank" rel="noopener">代谢公式参考</a> · <a href="https://www.niddk.nih.gov/health-information/weight-management/body-weight-planner" target="_blank" rel="noopener">Hall 动态模型依据</a></p></section><p class="note"><button onclick="showCredits()">照片来源与许可</button></p><p class="note">iPhone：Safari 分享 → 添加到主屏幕。数据留在这台设备，请定期备份。</p>`}
function profileForm(){let p={height:'',weight:'',target:'',age:'',sex:'',activity:1.2,...state.profile},manual=p.budgetMode==='auto'?'':(dailyBudget()||'');modal('个人设置',`<form id="profileform" oninput="planPreview()" onsubmit="event.preventDefault();saveProfile()"><label for="p_budget">每日目标摄入 · 大卡</label><input id="p_budget" type="number" min="1" max="10000" step="any" value="${manual}" placeholder="自己填写，如 1500"><div class="fields">${[['height','身高 · cm',100,250],['weight','当前体重 · kg',25,350],['target','目标体重 · kg',25,350],['age','年龄',18,100]].map(([k,n,min,max])=>`<div><label for="p_${k}">${n}</label><input id="p_${k}" type="number" min="${min}" max="${max}" step="${k==='age'?'1':'any'}" value="${p[k]??''}"></div>`).join('')}<div><label for="p_sex">生理性别（用于公式）</label><select id="p_sex"><option value="">请选择</option><option value="female" ${p.sex==='female'?'selected':''}>女</option><option value="male" ${p.sex==='male'?'selected':''}>男</option></select></div><div><label for="p_activity">日常活动量</label><select id="p_activity">${[[1.2,'久坐 / 很少运动'],[1.375,'轻度活动'],[1.55,'中度活动'],[1.725,'高度活动']].map(([v,n])=>`<option value="${v}" ${Number(p.activity)===v?'selected':''}>${n}</option>`).join('')}</select></div></div><label for="p_duration">目标期限</label><div class="duration-fields"><input id="p_duration" aria-label="目标期限数值" type="number" min="1" step="1" value="${p.duration||''}" placeholder="如 3"><select id="p_durationunit" aria-label="目标期限单位"><option value="month" ${p.durationUnit!=='day'?'selected':''}>个月</option><option value="day" ${p.durationUnit==='day'?'selected':''}>天</option></select></div><p class="note" style="margin-top:10px">不填每日大卡时，可按身体信息、目标体重和期限估算。</p><details><summary>模型参数（选填）</summary><div class="fields">${[['bodyFat','实测体脂率 · %',0.1,99],['maintenance','体重稳定时每日摄入 · 大卡',1,20000],['baselineCarbPercent','原饮食碳水供能 · %',1,100],['carbPercent','计划碳水供能 · %',0,100],['sodiumChange','每日钠摄入变化 · mg',-20000,20000]].map(([k,n,min,max])=>`<div><label for="p_${k}">${n}</label><input id="p_${k}" type="number" step="any" min="${min}" max="${max}" value="${p[k]??''}"></div>`).join('')}</div><p class="note">未填体脂率用回归式估计；未填维持摄入用静息代谢×活动系数，假设起始体重稳定。碳水默认各占50%，钠摄入默认不变。</p></details><div id="planpreview" class="food-calc"></div><div class="actions"><button type="button" class="secondary" onclick="modalClose()">取消</button><button class="primary">保存</button></div></form>`);planPreview()}

function saveProfile(){let p=readProfileForm(),manual=Number($('#p_budget').value),result=calculatePlan(p);if(!manual&&p.duration&&!result.budget)return toast(result.message);p.budget=manual>0?manual:result.budget||null;p.budgetMode=manual>0?'manual':p.budget?'auto':null;p.targetDate=p.budgetMode==='auto'?result.targetDate:null;p.planStarted=today();p.modelVersion=p.budgetMode==='auto'?BodyModel.version:null;state.profile=p;delete state.budget;if(!save())return;modalClose();render();toast('个人设置已更新')}

function report(d){let ls=logs(d);modal('饮食速报',`<p class="eyebrow" style="margin-top:16px">${d} · DAILY RECAP</p><div class="hero" style="margin:15px 0"><div><small>当日总摄入</small><div class="big">${Math.round(total(d))}<span> 大卡</span></div><small>${state.complete[d]?'✓ 已标记记录完整':'尚未标记完整'}</small></div><span style="font-size:40px">◒</span></div>${ls.map(l=>`<div class="foodrow">${icon(l)}<div class="grow"><strong>${esc(l.name||'热量记录')}</strong><p class="sub">${esc(l.meal||'未分类')} · ${l.grams?l.grams+' 克':'未填克数'}${l.grams?' · '+Math.round(l.kcal/l.grams*1000)/1000+' 大卡/克':''}</p></div><span>${round(l.kcal)} 大卡</span></div>`).join('')}<button class="primary" style="width:100%;margin-top:20px" onclick="selected='${d}';modalClose();go('log')">查看 / 编辑这一天</button>`)}
function exportData(){let b=new Blob([JSON.stringify({app:'shiguang',version:1,data:state},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`食光备份-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
async function importData(input){try{let x=JSON.parse(await input.files[0].text());if(x.app!=='shiguang'||x.version!==1||!Array.isArray(x.data.foods)||!Array.isArray(x.data.logs)||!x.data.complete||!x.data.seen)throw Error();for(let f of x.data.foods)if(typeof f.id!=='string'||!/^[-a-zA-Z0-9_]{1,100}$/.test(f.id)||typeof f.name!=='string'||!Number.isFinite(f.kcal)||f.kcal<0||f.photo&&!safePhoto(f.photo))throw Error();for(let l of x.data.logs)if(typeof l.id!=='string'||!/^[-a-zA-Z0-9_]{1,100}$/.test(l.id)||!Number.isFinite(l.kcal)||l.kcal<0||!/^\d{4}-\d{2}-\d{2}$/.test(l.date)||l.photo&&!safePhoto(l.photo))throw Error();if(!confirm('用备份替换本机数据？建议先导出当前备份。'))return;let old=state;state=x.data;if(!save()){state=old;return}migrateCatalog();refreshAutoBudget();render();toast('已恢复备份')}catch{toast('无法读取，请选择有效的食光备份文件')}}
function dailyRecap(){let d=today(),y=shift(d,-1);if(!state.seen[d]&&logs(y).length){state.seen[d]=true;save();report(y)}}
refreshAutoBudget();render();dailyRecap();let day=today();setInterval(()=>{if(today()!==day){day=today();selected=day;render();dailyRecap()}},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(today()!==day){day=today();selected=day;render()}dailyRecap()}});

function filterFoodChoices(q){let select=$('#foodpick');for(let o of select.options)o.hidden=!!o.value&&!o.textContent.includes(q)}

function photoSrc(p){return p?.startsWith('builtin:')?(CATALOG.find(f=>f.key===p.slice(8))?.photo||''):p}
function safePhoto(p){return /^builtin:[a-z]+$/.test(p)||/^data:image\/(jpeg|png|webp);base64,/.test(p)||/^photos\/[a-z0-9_-]+\.(jpg|png|webp)$/.test(p)}
function toggleMeal(key){collapsed[key]=collapsed[key]===false;render()}
function estimateInfo(){let f=forecast();modal('目标时间测算',`<p style="margin:20px 0">${esc(f.text)}</p>${f.insufficient?'<p class="note">至少需要3个已打卡完整日；漏记日期不按零摄入计算。</p>':f.avg!=null?`<p class="note">按个人设置中的当前体重、最近 ${f.recorded} 个完整日平均摄入 ${round(f.avg)} 大卡模拟；假设以后摄入与活动保持相近。更新当前体重后会重新计算。</p>`:''}${f.scenario?`<p class="note">把初始消耗上下浮动10%作情景检验：${f.scenario.every(x=>x!=null)?Math.min(...f.scenario)+'–'+Math.max(...f.scenario)+'天':f.scenario.map(x=>x==null?'模拟期内未到达':x+'天').join(' / ')}。这是模型敏感性情景，不是统计置信区间。</p>`:''}<p class="note" style="margin-top:14px">脂肪与瘦体重分开变化，并计算糖原、水分及消耗适应；瘦体重变化不等于肌肉变化。不是体成分测量，也不保证到达日期。</p><button class="primary" style="margin-top:18px" onclick="modalClose();go('me')">个人设置与模型说明</button>`)}

function budgetForm(){profileForm()}

function liquidDensity(f){return f?.density??({oil:0.92,soy:1.12}[f?.seed]||0)}
function updatePart(i,value){let p=recipe.parts[i],f=state.foods.find(f=>f.id===p.foodId);p.amount=Number(value);p.grams=p.unit==='spoon'?p.amount*7*liquidDensity(f):p.amount;foodCalc()}
function setPartUnit(i,unit){let p=recipe.parts[i],d=liquidDensity(state.foods.find(f=>f.id===p.foodId));p.unit=unit;p.amount=unit==='spoon'?p.grams/(7*d):p.grams;foodEditor()}
function setSpoon(i,n){stashFood();let p=recipe.parts[i];p.unit='spoon';p.amount=n;p.grams=n*7*liquidDensity(state.foods.find(f=>f.id===p.foodId));foodEditor()}
function servingSelect(d){let f=state.foods.find(f=>f.id===d.foodId);return f?.servings?`<select id="logunit" class="log-unit" aria-label="数量单位" onchange="changeLogUnit(this.value)"><option value="g">克</option><option value="serving" ${d.amountUnit==='serving'?'selected':''}>份</option></select>`:''}
function logGrams(){let f=state.foods.find(f=>f.id===draft.foodId);return Number($('#grams').value)*(($('#logunit')?.value==='serving'&&f?.servings)?(f.yield||f.packgrams)/f.servings:1)}
function changeLogUnit(unit){let f=state.foods.find(f=>f.id===draft.foodId),g=draft.amountUnit==='serving'?Number($('#grams').value)*(f.yield||f.packgrams)/f.servings:Number($('#grams').value);$('#grams').value=unit==='serving'?g/((f.yield||f.packgrams)/f.servings):g;draft.amountUnit=unit;recalcLog()}
function versionKey(f){return f.groupId||f.id}
function versionCount(f){return state.foods.filter(x=>versionKey(x)===versionKey(f)).length}
function groupFoods(fs){let groups=new Map();for(let f of fs){let k=versionKey(f),old=groups.get(k);if(!old||(f.createdAt||0)>(old.createdAt||0))groups.set(k,f)}return [...groups.values()]}
function versionLabel(f){return f.createdAt?new Date(f.createdAt).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}):'原配方'}
function openVersions(id,context){let f=state.foods.find(f=>f.id===id),vs=state.foods.filter(x=>versionKey(x)===versionKey(f)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));if(vs.length===1){if(context==='library')foodForm(id);else chooseFood(id);return}modal(esc(f.name),`<div class="version-list">${vs.map(v=>`<div class="version-row"><button onclick="${context==='library'?`foodForm('${v.id}')`:`chooseFood('${v.id}')`}">${icon(v)}<span><strong>${versionLabel(v)}</strong><small>${round(v.kcal)} 大卡 / 100g${v.servings?' · '+v.servings+'份':''}</small></span></button>${context!=='library'?`<button class="secondary" onclick="foodForm('${v.id}',true)">改做法</button>`:''}</div>`).join('')}</div>`)}

function dailyBudget(){let n=state.profile?.budget??state.budget;return Number.isFinite(Number(n))&&Number(n)>0?Number(n):null}
function validBody(p){return !!p&&p.height>=100&&p.height<=250&&p.weight>=25&&p.weight<=350&&p.age>=18&&p.age<=100&&['female','male'].includes(p.sex)&&p.activity>0}
function dailyBurn(p){return (10*p.weight+6.25*p.height-5*p.age+(p.sex==='male'?5:-161))*p.activity}
function readProfileForm(){let p={};for(let k of ['height','weight','target','age','activity','duration','bodyFat','maintenance','baselineCarbPercent','carbPercent','sodiumChange']){let value=$('#p_'+k)?.value;p[k]=value===''||value==null?null:Number(value)}p.sex=$('#p_sex').value;p.durationUnit=$('#p_durationunit').value;return p}

function calculatePlan(p,start=today()){if(!validBody(p)||!(p.target>0)||!(p.duration>0)){let missing=[];if(!(p.height>=100&&p.height<=250))missing.push('身高');if(!(p.weight>=25&&p.weight<=350))missing.push('当前体重');if(!(p.age>=18&&p.age<=100))missing.push('年龄');if(!['female','male'].includes(p.sex))missing.push('生理性别');if(!(p.activity>0))missing.push('活动量');if(!(p.target>0))missing.push('目标体重');if(!(p.duration>0))missing.push('目标期限');return {message:'还需填写：'+missing.join('、')}}let end=new Date(start+'T12:00:00');if(p.durationUnit==='day')end.setDate(end.getDate()+p.duration);else{let day=end.getDate();end.setDate(1);end.setMonth(end.getMonth()+p.duration);end.setDate(Math.min(day,new Date(end.getFullYear(),end.getMonth()+1,0).getDate()))}let targetDate=dateKey(end),days=Math.round((Date.UTC(end.getFullYear(),end.getMonth(),end.getDate())-Date.parse(start+'T00:00:00Z'))/86400000);if(!(days>0)||days>3650)return {message:'请填写有效期限（最多3650天）'};let key=JSON.stringify([p,start]);if(planCache.key===key)return planCache.value;let solved=BodyModel.solve(p,p.target,days),answer=solved.error?{message:solved.error}:{budget:Math.round(solved.intake),exactBudget:solved.intake,burn:Math.round(solved.baseline),finalBurn:Math.round(solved.result.expenditure),days,targetDate,bodyFatEstimated:solved.bodyFatEstimated,model:BodyModel.version};planCache={key,value:answer};return answer;}

function planPreview(){let manual=Number($('#p_budget').value),p=readProfileForm();if(manual>0){$('#planpreview').innerHTML=`每日目标 ${round(manual)} 大卡`;return}let r=calculatePlan(p);$('#planpreview').innerHTML=r.budget!=null?`<strong>模型测算摄入约 ${r.budget} 大卡/天</strong><p style="margin-top:8px">估算消耗 ${r.burn} → ${r.finalBurn} 大卡/天 · ${r.days} 天</p><p class="note">动态模型测算；水分和实际代谢会带来偏差。<a href="https://www.niddk.nih.gov/research-funding/at-niddk/labs-branches/laboratory-biological-modeling/integrative-physiology-section/research/body-weight-planner" target="_blank" rel="noopener">模型依据</a></p>`:r.message}


async function readPhoto(input){const file=input.files?.[0],target=recipe||draft;if(!file||!target)return;let url=URL.createObjectURL(file);try{let img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});let scale=Math.min(1,600/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);target.photo=canvas.toDataURL('image/jpeg',.76);if(target===recipe&&$('.photo'))$('.photo').innerHTML=`<img src="${target.photo}" alt="食物照片">`}catch{toast('照片读取失败，请从相册选择 JPEG 或 PNG 照片')}finally{URL.revokeObjectURL(url)}}
