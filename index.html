const seeds=CATALOG;

 for(let seed of seeds){let f=state.foods.find(f=>f.seed===seed.key||f.type==='ingredient'&&f.name===seed.name);if(f){if(!f.photo||!f.photo.startsWith('data:')){f.photo='builtin:'+seed.key;f.photoCredit=seed.photoCredit}f.seed=seed.key;f.note??=seed.note;f.unitGrams??=seed.unitGrams;f.unitName??=seed.unitName;f.source??=seed.source;}else state.foods.push({...seed,photo:'builtin:'+seed.key,id:uid(),type:'ingredient',last:0,seed:seed.key});}

function save(){try{localStorage.setItem('shiguang-v1',JSON.stringify(state));return true}catch{alert('存储空间不足，修改未保存。请先导出备份并减少图片大小。');return false}}
function toast(msg){let t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),2400)}
const meals=['午饭','晚饭','额外','早餐'], mealIcon=m=>({'午饭':'☀️','晚饭':'🌙','额外':'☕','早餐':'🌤️','未分类':'🍽️'}[m]||'🍽️'), logs=d=>state.logs.filter(l=>l.date===d),total=d=>logs(d).reduce((s,l)=>s+Number(l.kcal),0),round=n=>Math.round(n*10)/10;
function icon(f){return `<div class="icon ${f.photo?'':'no-photo'}">${f.photo?`<img src="${esc(photoSrc(f.photo))}" alt="${esc(f.name||'食物照片')}" loading="lazy">`:'<span class="photo-placeholder" aria-label="暂无照片"></span>'}</div>`}

function modalClose(){ $('#overlay').innerHTML='';draft=null;recipe=null;pickerContext=null;heldRecipe=null;heldLog=null;returnToLog=false }
function modal(title,content){$('#overlay').innerHTML=`<div class="modalback"><section role="dialog" aria-modal="true" aria-label="${esc(title)}" class="modal"><div class="row"><h2>${title}</h2><button aria-label="关闭" class="close" onclick="modalClose()">×</button></div>${content}</section></div>`}
function go(p){page=p;search='';render()}

function pageHeader(title,en,right=''){return `<header class="top"><div><div class="eyebrow">${en}</div><h1>${title}</h1></div>${right}</header>`}
function dateControl(){return `<input class="dateinput" aria-label="记录日期" type="date" value="${selected}" max="${today()}" onchange="selected=this.value||today();render()">`}
function render(){document.body.dataset.page=page;$('#nav').innerHTML=[['home','◒','今日'],['log','＋','记饮食'],['library','▤','食物库'],['me','♧','我的']].map(([id,i,n])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><b>${i}</b>${n}</button>`).join('');$('#main').innerHTML=({home,log:logPage,library,me:myPage}[page])()}

function chart(){let dates=Array.from({length:7},(_,i)=>shift(selected,i-6)),max=Math.max(state.profile?.budget||state.budget||1200,...dates.map(total))*1.15;let points=[];return `<div class="chart">${dates.map((d,i)=>{let v=total(d);if(logs(d).length)points.push(`${(i+.5)/7*100},${100-v/max*85}`);return `<div class="barcol"><span>${logs(d).length?Math.round(v):'—'}</span><div class="bar ${d===selected?'today':''}" style="height:${v/max*85}%"></div><span>${d===today()?'今天':d.slice(5).replace('-','/')}</span></div>`}).join('')}<svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${points.join(' ')}" fill="none" stroke="#b6a375" stroke-width="1" vector-effect="non-scaling-stroke"/></svg></div>`}
function forecast(){let p=state.profile;if(!p)return {text:'设置目标',missing:true};let ds=Object.keys(state.complete).filter(d=>state.complete[d]&&d<today()).sort().slice(-14),avg=ds.length?ds.reduce((a,d)=>a+total(d),0)/ds.length:0;if(ds.length<3)return {text:`还需 ${3-ds.length} 个完整日`};if(p.target/(p.height/100)**2<18.5)return {text:'目标需调整'};let delta=p.weight-p.target;if(!delta)return {text:'已达目标'};let tdee=(10*p.weight+6.25*p.height-5*p.age+(p.sex==='male'?5:-161))*p.activity;let days=Math.ceil(delta*7700/(tdee-avg));return days>0&&Number.isFinite(days)?{text:`约 ${days} 天`,days}:{text:'暂无到达时间'};}
function prediction(){return forecast().text}
function home(){let v=total(selected),budget=state.profile?.budget||state.budget||1200,pct=Math.round(v/budget*100),f=forecast();return `<div class="home-date">${dateControl()}</div><section class="hero minimal-hero" aria-label="摄入 ${Math.round(v)}，目标 ${budget}，${pct}%"><div class="big">${Math.round(v)} <span>/ <button class="budget-number" aria-label="修改每日目标" onclick="budgetForm()">${budget}</button></span></div><div class="ring" style="--p:${Math.min(pct,100)}%"><div><strong>${pct}%</strong></div></div></section><section class="card combined"><div class="row"><h3>一周趋势</h3><button class="estimate" onclick="${f.missing?'profileForm()':'estimateInfo()'}">${state.profile?state.profile.target+' kg · ':''}${f.text} ›</button></div>${chart()}</section>${mealCards()}<button class="checkin ${state.complete[selected]?'done':''}" onclick="state.complete[selected]=!state.complete[selected];save();render()">${state.complete[selected]?'✓ 已打卡':'○ 今日打卡'}</button>`}

function mealCards(){let groups=['午饭','晚饭','额外'];if(logs(selected).some(l=>l.meal==='早餐'))groups.unshift('早餐');if(logs(selected).some(l=>!l.meal))groups.push('未分类');return groups.map((m,i)=>{let ls=logs(selected).filter(l=>(l.meal||'未分类')===m),key=selected+m,open=collapsed[key]===false;return `<section class="meal-block tone-${i%3}"><div class="meal-banner"><button class="meal-toggle" aria-expanded="${open}" onclick="toggleMeal('${esc(key)}')"><h2>${m}</h2><span>${Math.round(ls.reduce((a,l)=>a+l.kcal,0))} <small>大卡</small> <span class="chevron">${open?'⌃':'⌄'}</span></span></button><button class="meal-add" aria-label="添加${m}" onclick="logForm(null,'${m==='未分类'?'':m}')">＋</button></div>${open?`<div class="meal-items">${ls.map(l=>`<button class="foodrow" onclick="logForm('${l.id}')">${icon(l)}<div class="grow"><strong>${esc(l.name||'热量记录')}</strong><p class="sub">${l.grams?l.grams+' g':''}</p></div><span>${round(l.kcal)}<small> 大卡</small></span></button>`).join('')||'<div class="empty">暂无记录</div>'}</div>`:''}</section>`}).join('')}

function logPage(){return mealCards()}

function library(){return `<div class="library-tabs"><button class="${libraryType==='dish'?'active':''}" onclick="libraryType='dish';search='';render()">菜品</button><button class="${libraryType==='ingredient'?'active':''}" onclick="libraryType='ingredient';search='';render()">食材</button></div><input class="search" placeholder="搜索" aria-label="搜索食物" value="${esc(search)}" oninput="search=this.value;$('#foodresults').innerHTML=foodResults()"><div id="foodresults">${foodResults()}</div>`}

function foodResults(){let fs=state.foods.filter(f=>(libraryType==='ingredient'?f.type==='ingredient':f.type!=='ingredient')&&f.name.includes(search)).sort((a,b)=>(b.last||0)-(a.last||0));return `<div class="foodgrid three"><button class="foodtile new-tile" onclick="foodForm()"><div class="new-photo">＋</div><small>新建${libraryType==='ingredient'?'食材':'菜品'}</small></button>${fs.map(f=>foodTile(f,`foodForm('${f.id}')`)).join('')}</div>`}

function photoInput(photo=''){return `<label class="photo" for="photo">${photo?`<img src="${esc(photoSrc(photo))}" alt="食物照片">`:'<span>＋ 添加照片</span>'}</label><input id="photo" class="hide" type="file" accept="image/*" onchange="readPhoto(this)">`}

function logForm(id=null,meal=''){let l=state.logs.find(x=>x.id===id);draft=l?{...l}:{id:uid(),date:today(),meal,name:'',grams:'',kcal:'',foodId:'',manual:false};recipe=null;if(l)renderLogEditor();else openPicker('log');}
function stashLog(){if(!draft||!$('#logform'))return;Object.assign(draft,{name:$('#logname').value,grams:$('#grams').value,kcal:$('#kcal').value,date:$('#logdate').value,meal:$('#meal').value});}
function renderLogEditor(){let d=draft;modal('',`<form id="logform" onsubmit="event.preventDefault();saveLog()"><button type="button" class="chosen-food" onclick="stashLog();openPicker('log')">${d.photo?icon(d):''}<h2>${esc(d.name||'今天吃了什么')}</h2><span>更换 ›</span></button><label for="logname">名称</label><input id="logname" value="${esc(d.name)}" placeholder="可留空"><div class="fields"><div><label for="grams">克数</label><input id="grams" type="number" min="0" step="any" value="${d.grams??''}" oninput="recalcLog()"></div><div><label for="kcal">大卡</label><input id="kcal" required type="number" min="0" step="any" value="${d.kcal??''}" oninput="draft.manual=true"></div></div><div class="fields"><div><label for="logdate">日期</label><input id="logdate" required type="date" max="${today()}" value="${d.date}"></div><div><label for="meal">餐别</label><select id="meal"><option value="">未分类</option>${meals.map(m=>`<option ${m===d.meal?'selected':''}>${m}</option>`).join('')}</select></div></div><label class="keep"><input id="keepfood" type="checkbox"> 存为菜品</label><div class="actions">${state.logs.some(l=>l.id===d.id)?`<button type="button" class="secondary" onclick="deleteLog('${d.id}')">删除</button>`:''}<button class="primary">完成</button></div></form>`)}
function openPicker(context){pickerContext=context;pickerQuery='';modal(context==='ingredient'?'选食材':'选菜',`<div class="picker"><input class="search" aria-label="搜索" placeholder="搜索" oninput="pickerQuery=this.value;$('#picker-results').innerHTML=pickerResults()"><div id="picker-results">${pickerResults()}</div>${context==='log'?'<button class="quick-log secondary" onclick="pickerContext=null;renderLogEditor()">直接填大卡</button>':''}</div>`)}
function foodTile(f,action){return `<button class="foodtile" onclick="${action}">${icon(f)}<strong>${esc(f.name)}</strong><small>${round(f.kcal)} 大卡 / 100g</small>${f.unitGrams?`<small>约 1${esc(f.unitName||'个')} · ${f.unitGrams}g / ${round(f.kcal*f.unitGrams/100)} 大卡</small>`:''}</button>`}
function pickerResults(){let fs=state.foods.filter(f=>(pickerContext==='ingredient'?f.type==='ingredient':f.type!=='ingredient')&&f.name.includes(pickerQuery)).sort((a,b)=>(b.last||0)-(a.last||0));return `<div class="foodgrid two"><button class="foodtile new-tile" onclick="newFromPicker()"><div class="new-photo">＋</div><small>新建${pickerContext==='ingredient'?'食材':'菜品'}</small></button>${fs.map(f=>foodTile(f,`chooseFood('${f.id}')`)).join('')}</div>`}
function chooseFood(id){let f=state.foods.find(f=>f.id===id);if(!f)return;if(pickerContext==='ingredient'){recipe.parts.push({foodId:id,grams:100});pickerContext=null;foodEditor();return}Object.assign(draft,{foodId:id,name:f.name,photo:f.photo,grams:100,kcal:round(f.kcal),manual:false});pickerContext=null;renderLogEditor();}
function pickFood(id){chooseFood(id)}
function recalcLog(){let f=state.foods.find(f=>f.id===draft.foodId);if(f){$('#kcal').value=round(Number($('#grams').value)*f.kcal/100);draft.manual=false}}
function saveLog(){let l={...draft,name:$('#logname').value.trim(),grams:$('#grams').value?Number($('#grams').value):null,kcal:Number($('#kcal').value),date:$('#logdate').value,meal:$('#meal').value};if(!Number.isFinite(l.kcal)||l.kcal<0||!l.date||l.date>today())return toast('请填写有效的日期和大卡');if($('#keepfood').checked){if(!l.name||!(l.grams>0))return toast('存为食物需要填写名称和大于零的克数');let f={id:uid(),name:l.name,emoji:l.emoji,photo:l.photo,type:'product',kcal:l.kcal/l.grams*100,last:Date.now()};state.foods.push(f);l.foodId=f.id}let i=state.logs.findIndex(x=>x.id===l.id);i<0?state.logs.push(l):state.logs.splice(i,1,l);let f=state.foods.find(f=>f.id===l.foodId);if(f)f.last=Date.now();state.complete[l.date]=false;if(!save())return;selected=l.date;modalClose();render();toast('已保存这份食光')}
function deleteLog(id){if(!confirm('删除这条饮食记录？'))return;let l=state.logs.find(x=>x.id===id);state.complete[l.date]=false;state.logs=state.logs.filter(x=>x.id!==id);save();modalClose();render()}
let returnToLog=false,heldLog=null,heldRecipe=null,heldReturn=false;
function foodForm(id=null,fromLog=false,forcedType=null){returnToLog=fromLog;if(fromLog&&draft){stashLog();heldLog={...draft}}let f=state.foods.find(x=>x.id===id);recipe=f?JSON.parse(JSON.stringify(f)):{id:uid(),name:'',type:forcedType||(libraryType==='ingredient'?'ingredient':'recipe'),kcal:'',parts:[],yield:''};recipe.parts||=[];foodEditor()}
function newFromPicker(){let ctx=pickerContext;pickerContext=null;if(ctx==='ingredient'){heldRecipe=recipe;heldReturn=returnToLog;foodForm(null,false,'ingredient')}else{heldLog={...draft};foodForm(null,true,'recipe')}}
function foodEditor(){let r=recipe;modal(r.type==='ingredient'?'食材':r.name?'编辑菜品':'新建菜品',`<form onsubmit="event.preventDefault();saveFood()">${photoInput(r.photo)}<label for="fname">名称</label><input required id="fname" value="${esc(r.name)}">${r.type!=='ingredient'?`<div class="tabs"><button type="button" class="${r.type==='recipe'?'active':''}" onclick="stashFood();recipe.type='recipe';foodEditor()">自己做菜</button><button type="button" class="${r.type==='product'?'active':''}" onclick="stashFood();recipe.type='product';foodEditor()">购买成品</button></div>`:''}${r.type==='recipe'?`<div id="parts">${partRows()}</div><button type="button" class="secondary" onclick="stashFood();openPicker('ingredient')">＋ 食材</button><label for="yield">出锅后总重量 · g</label><input id="yield" type="number" min="0.1" step="any" required value="${r.yield||''}" oninput="foodCalc()">`:`<div class="fields"><div><label for="packgrams">重量 · g</label><input id="packgrams" type="number" min="0.1" step="any" required value="${r.packgrams||100}" oninput="foodCalc()"></div><div><label for="packkcal">对应大卡</label><input id="packkcal" type="number" min="0" step="any" required value="${r.packkcal??r.kcal}" oninput="foodCalc()"></div></div>`}<div id="foodcalc" class="food-calc"></div>${r.type==='ingredient'?`<details><summary>单个份量 / 食材说明</summary><div class="fields"><div><label for="unitgrams">约一个的可食重量 · g</label><input id="unitgrams" type="number" min="0" step="any" value="${r.unitGrams||''}"></div><div><label for="unitname">单位</label><input id="unitname" value="${esc(r.unitName||'个')}"></div></div><label for="foodnote">说明</label><input id="foodnote" value="${esc(r.note||'生重，可食部分；每个大小不同，以称重为准')}"><p class="note">${esc(r.source||'用户录入，请以包装营养表为准')}</p></details>`:''}<div class="actions">${state.foods.some(f=>f.id===r.id)?`<button type="button" class="secondary" onclick="deleteFood()">删除</button>`:''}<button class="primary">保存</button></div></form>`);foodCalc()}

function partRows(){return (recipe.parts||[]).map((p,i)=>{let f=state.foods.find(f=>f.id===p.foodId);return `<div class="ingredient">${icon(f||{})}<span class="grow">${esc(f?.name||'已删除食材')}</span><input aria-label="${esc(f?.name||'食材')}克数" type="number" min="0" step="any" placeholder="克" value="${p.grams||''}" oninput="recipe.parts[${i}].grams=Number(this.value);foodCalc()"><small>g</small><button type="button" aria-label="删除食材" onclick="stashFood();recipe.parts.splice(${i},1);foodEditor()">×</button></div>`}).join('')}

function stashFood(){if(!recipe||!$('#fname'))return;recipe.name=$('#fname').value;if($('#yield'))recipe.yield=Number($('#yield').value);if($('#packgrams')){recipe.packgrams=Number($('#packgrams').value);recipe.packkcal=Number($('#packkcal').value);recipe.kcal=recipe.packkcal/recipe.packgrams*100}if($('#unitgrams')){recipe.unitGrams=Number($('#unitgrams').value)||null;recipe.unitName=$('#unitname').value;recipe.note=$('#foodnote').value}}

function foodCalc(){if(!recipe)return;let k;if(recipe.type==='recipe'){let sum=(recipe.parts||[]).reduce((s,p)=>s+(state.foods.find(f=>f.id===p.foodId)?.kcal||0)*Number(p.grams)/100,0);k=sum/Number($('#yield')?.value)*100;recipe.computed=k;$('#foodcalc').innerHTML=`<small>整道菜共 ${round(sum)} 大卡</small><p style="margin-top:10px">${Number.isFinite(k)?`${round(k)} 大卡 / 100 克 · ${round(k/100)} 大卡 / 克`:'填写食材和出锅重量后计算'}</p>`}else{k=Number($('#packkcal')?.value)/Number($('#packgrams')?.value)*100;recipe.computed=k;$('#foodcalc').innerHTML=Number.isFinite(k)?`${round(k)} 大卡 / 100 克 · ${round(k/100)} 大卡 / 克`:'填写包装重量与热量后计算'}}
function saveFood(){stashFood();foodCalc();if(!recipe.name.trim()||!Number.isFinite(recipe.computed)||recipe.computed<0)return toast('请检查名称、重量与热量');if(recipe.type==='recipe'&&(!(recipe.yield>0)||!recipe.parts.some(p=>p.grams>0)))return toast('请添加食材和出锅重量');let f={...recipe,kcal:recipe.computed},i=state.foods.findIndex(x=>x.id===f.id);i<0?state.foods.push(f):state.foods.splice(i,1,f);if(!save())return;if(heldRecipe){recipe=heldRecipe;heldRecipe=null;returnToLog=heldReturn;recipe.parts.push({foodId:f.id,grams:100});foodEditor();return}if(returnToLog){draft={...heldLog,foodId:f.id,name:f.name,photo:f.photo,grams:100,kcal:round(f.kcal),manual:false};recipe=null;returnToLog=false;heldLog=null;renderLogEditor()}else{modalClose();render()}toast('已保存')}

function deleteFood(){if(state.foods.some(f=>(f.parts||[]).some(p=>p.foodId===recipe.id)))return toast('该食材正被菜品引用，请先编辑相关菜品');if(!confirm('删除这个食物？历史饮食记录仍会保留。'))return;state.foods=state.foods.filter(f=>f.id!==recipe.id);save();modalClose();render()}
function myPage(){let p=state.profile;return '<h1 class="settings-title">我的</h1>'+`<section class="card"><div class="row"><div><h2>个人信息与目标</h2><p class="sub">${p?`${p.height} cm · ${p.weight} kg → ${p.target} kg`:'还没设置，先认识一下自己'}</p></div><button class="secondary" onclick="profileForm()">编辑</button></div>${p?`<div class="stats"><div><strong>${p.budget}</strong><small>每日目标 · 大卡</small></div><div><strong>${Math.round(10*p.weight+6.25*p.height-5*p.age+(p.sex==='male'?5:-161))}</strong><small>静息代谢估算 · 大卡</small></div></div>`:''}</section><section class="card"><h3>饮食速报</h3><p class="sub">所有已记录日期都在这里，持续保留</p>${[...new Set(state.logs.map(l=>l.date))].sort().reverse().map(d=>`<button class="row" style="width:100%;padding:15px 0;border-bottom:1px solid var(--line)" onclick="report('${d}')"><span>${d}</span><span>${Math.round(total(d))} 大卡　›</span></button>`).join('')||'<p class="empty">记下第一餐后，这里就会有你的速报。</p>'}</section><section class="card"><h3>数据与备份</h3><p class="note" style="margin:12px 0">当前版本保存在此设备的浏览器中，不自动清空。清理浏览器数据或更换手机前，请导出备份；支持把照片和全部记录一起恢复。</p><div class="row"><button class="secondary" onclick="exportData()">↓ 导出备份</button><button class="secondary" onclick="$('#importfile').click()">↑ 恢复备份</button></div><input class="hide" id="importfile" type="file" accept="application/json" onchange="importData(this)"></section><section class="card source"><h3>计算方式</h3><p class="note" style="margin-top:12px">静息代谢（Mifflin–St Jeor）：10 × 体重(kg) + 6.25 × 身高(cm) − 5 × 年龄 + 常数；男 +5，女 −161。<br>每日总消耗估算 = 静息代谢 × 活动系数。活动量影响总消耗，不直接改变静息代谢公式。<br>目标天数 ≈ 体重差 × 7700 ÷（估算总消耗 − 完整日平均摄入）。使用最近最多 14 个完整日，不把漏记日当作零摄入。仅是简化线性估算，不能反映代谢适应。</p><p class="note"><a href="https://www.unm.edu/~lkravitz/Article%20folder/Metabolism.pdf" target="_blank" rel="noopener">代谢公式参考</a> · <a href="https://www.niddk.nih.gov/health-information/weight-management/body-weight-planner" target="_blank" rel="noopener">NIDDK 体重预测说明</a></p></section><p class="note"><button onclick="showCredits()">照片来源与许可</button></p><p class="note">iPhone：Safari 分享 → 添加到主屏幕。数据留在这台设备，请定期备份。</p>`}
function profileForm(){let p=state.profile||{height:'',weight:'',target:'',age:'',sex:'female',activity:1.2,budget:1200};modal('我的个人设定',`<form onsubmit="event.preventDefault();saveProfile()"><p class="note" style="margin-top:12px">填写后用于成人代谢与趋势估算，每日摄入目标由你自己设置。</p><div class="fields">${[['height','身高 · cm',100,250],['weight','当前体重 · kg',25,350],['target','目标体重 · kg',25,350],['age','年龄',18,100]].map(([k,n,min,max])=>`<div><label for="p_${k}">${n}</label><input id="p_${k}" required type="number" min="${min}" max="${max}" step="${k==='age'?'1':'any'}" value="${p[k]}"></div>`).join('')}<div><label for="p_sex">公式使用的生理性别</label><select id="p_sex"><option value="female" ${p.sex==='female'?'selected':''}>女（常数 −161）</option><option value="male" ${p.sex==='male'?'selected':''}>男（常数 +5）</option></select></div></div><label for="p_activity">日常活动量</label><select id="p_activity">${[[1.2,'久坐 / 很少运动'],[1.375,'轻度活动 / 每周 1–3 次'],[1.55,'中度活动 / 每周 3–5 次'],[1.725,'高度活动 / 每周 6–7 次']].map(([v,n])=>`<option value="${v}" ${Number(p.activity)===v?'selected':''}>${n} · ×${v}</option>`).join('')}</select><p class="note" style="margin-top:15px">代谢估算还需要年龄和生理性别。未满 18 岁不使用此成人预测公式，可以跳过设置继续记录。</p><div class="actions"><button type="button" class="secondary" onclick="modalClose()">暂时跳过</button><button class="primary">保存设定</button></div></form>`)}
function saveProfile(){let p={};['height','weight','target','age','activity'].forEach(k=>p[k]=Number($('#p_'+k).value));p.sex=$('#p_sex').value;p.budget=state.profile?.budget||state.budget||1200;state.profile=p;if(!save())return;modalClose();render();toast('个人设定已更新')}
function report(d){let ls=logs(d);modal('饮食速报',`<p class="eyebrow" style="margin-top:16px">${d} · DAILY RECAP</p><div class="hero" style="margin:15px 0"><div><small>当日总摄入</small><div class="big">${Math.round(total(d))}<span> 大卡</span></div><small>${state.complete[d]?'✓ 已标记记录完整':'尚未标记完整'}</small></div><span style="font-size:40px">◒</span></div>${ls.map(l=>`<div class="foodrow">${icon(l)}<div class="grow"><strong>${esc(l.name||'热量记录')}</strong><p class="sub">${esc(l.meal||'未分类')} · ${l.grams?l.grams+' 克':'未填克数'}${l.grams?' · '+round(l.kcal/l.grams)+' 大卡/克':''}</p></div><span>${round(l.kcal)} 大卡</span></div>`).join('')}<button class="primary" style="width:100%;margin-top:20px" onclick="selected='${d}';modalClose();go('log')">查看 / 编辑这一天</button>`)}
function exportData(){let b=new Blob([JSON.stringify({app:'shiguang',version:1,data:state},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`食光备份-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
async function importData(input){try{let x=JSON.parse(await input.files[0].text());if(x.app!=='shiguang'||x.version!==1||!Array.isArray(x.data.foods)||!Array.isArray(x.data.logs)||!x.data.complete||!x.data.seen)throw Error();for(let f of x.data.foods)if(typeof f.id!=='string'||!/^[-a-zA-Z0-9_]{1,100}$/.test(f.id)||typeof f.name!=='string'||!Number.isFinite(f.kcal)||f.kcal<0||f.photo&&!safePhoto(f.photo))throw Error();for(let l of x.data.logs)if(typeof l.id!=='string'||!/^[-a-zA-Z0-9_]{1,100}$/.test(l.id)||!Number.isFinite(l.kcal)||l.kcal<0||!/^\d{4}-\d{2}-\d{2}$/.test(l.date)||l.photo&&!safePhoto(l.photo))throw Error();if(!confirm('用备份替换本机数据？建议先导出当前备份。'))return;let old=state;state=x.data;if(!save()){state=old;return}migrateCatalog();render();toast('已恢复备份')}catch{toast('无法读取，请选择有效的食光备份文件')}}
function dailyRecap(){let d=today(),y=shift(d,-1);if(!state.seen[d]&&logs(y).length){state.seen[d]=true;save();report(y)}}
render();dailyRecap();let day=today();setInterval(()=>{if(today()!==day){day=today();selected=day;render();dailyRecap()}},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(today()!==day){day=today();selected=day;render()}dailyRecap()}});

function filterFoodChoices(q){let select=$('#foodpick');for(let o of select.options)o.hidden=!!o.value&&!o.textContent.includes(q)}

function photoSrc(p){return p?.startsWith('builtin:')?(CATALOG.find(f=>f.key===p.slice(8))?.photo||''):p}
function safePhoto(p){return /^builtin:[a-z]+$/.test(p)||/^data:image\/(jpeg|png|webp);base64,/.test(p)||/^photos\/[a-z0-9_-]+\.(jpg|png|webp)$/.test(p)}
function toggleMeal(key){collapsed[key]=collapsed[key]===false;render()}
function estimateInfo(){modal('目标时间估算',`<p class="note" style="margin:20px 0">${prediction()}。采用最近最多 14 个已打卡完整日的平均摄入，至少需要 3 天。该结果按能量差粗估，代谢和水分变化会影响实际体重。</p><button class="primary" onclick="modalClose();go('me')">个人设定与公式</button>`)}

function budgetForm(){modal('每日目标',`<form onsubmit="event.preventDefault();let n=Number($('#newbudget').value);if(n>0){state.budget=n;if(state.profile)state.profile.budget=n;save();modalClose();render()}"><label for="newbudget">大卡</label><input required id="newbudget" type="number" min="1" max="10000" step="1" value="${state.profile?.budget||state.budget||1200}"><div class="actions"><button class="primary">保存</button></div></form>`)}
async function readPhoto(input){const file=input.files?.[0],target=recipe||draft;if(!file||!target)return;let url=URL.createObjectURL(file);try{let img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});let scale=Math.min(1,600/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);target.photo=canvas.toDataURL('image/jpeg',.76);if(target===recipe&&$('.photo'))$('.photo').innerHTML=`<img src="${target.photo}" alt="食物照片">`}catch{toast('照片读取失败，请从相册选择 JPEG 或 PNG 照片')}finally{URL.revokeObjectURL(url)}}
